<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>Why We Think · Website-Test</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0b1020; color: #f5f1ff; }
    main { width: min(100%, 720px); padding: clamp(28px, 6vw, 60px); border: 1px solid #4d4568; border-radius: 28px; background: linear-gradient(135deg, #211e3b, #111a2b); }
    .brand { margin: 0 0 30px; font-size: 17px; letter-spacing: .08em; color: #c7b7f3; }
    h1 { margin: 0 0 22px; font-size: clamp(32px, 6vw, 50px); line-height: 1.12; letter-spacing: -.03em; }
    p { font-size: 20px; line-height: 1.6; color: #d0cee1; }
    .version { display: inline-block; margin-top: 24px; padding: 9px 15px; border: 1px solid #76669b; border-radius: 999px; font-size: 16px; color: #e7dcff; }
  </style>
</head>
<body>
  <main>
    <p class="brand">WHY WE THINK</p>
    <h1>Die Testseite ist da.</h1>
    <p>Diese Seite dient dazu, die Veröffentlichung über GitHub Pages zu testen. Die eigentliche Website folgt später.</p>
    <span class="version">Veröffentlichungstest · Version 1</span>
  </main>
</body>
</html>
